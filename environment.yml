name: slrnet
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - matplotlib
  - seaborn
  - scikit-learn
  - opencv
  - pytorch
  - torchvision
  - torchaudio
  # Uncomment ONE of the following based on your system:
  # - cpuonly          # CPU only (no GPU)
  # - pytorch-cuda=11.8  # NVIDIA GPU with CUDA 11.8
  # - pytorch-cuda=12.1  # NVIDIA GPU with CUDA 12.1
  - pip:
    - mediapipe
    - tensorboard